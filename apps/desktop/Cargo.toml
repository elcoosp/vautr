[package]
name = "vautr-desktop"
version.workspace = true
# CRITICAL: gpui + gpui-component master require edition 2024 (RAII drop order,
# async closures, impl Trait capture rules, etc.). The workspace default is 2021.
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Vautr native desktop client (GPUI). Sole holder of read_secret (desktop-api)."

[[bin]]
name = "vautr-desktop"
path = "src/main.rs"

[dependencies]
# ---------------------------------------------------------------------------
# GPUI from zed-industries/zed master.  gpui-component from longbridge master.
# Both use edition 2024 and share the same gpui crate, so NO [patch] needed.
# ---------------------------------------------------------------------------
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }

# --- core (workspace-pinned) ---
zeroize.workspace = true
tokio.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true

# Sole consumer of the restricted `read_secret` API (data.md §4, build §2.5).
# The desktop-api feature gate must never be enabled by web/extension/mobile.
vautr-app-state = { workspace = true, features = ["desktop-api", "mlock"] }
vautr-domain.workspace = true
vautr-db.workspace = true
vautr-auth.workspace = true
vautr-crypto.workspace = true
vautr-sharing.workspace = true
vautr-keyring.workspace = true
sea-orm.workspace = true
reqwest.workspace = true
base64.workspace = true
rand.workspace = true
ed25519-dalek = { workspace = true }
chrono.workspace = true
async-io = "2"

[dev-dependencies]
tempfile = "3"
