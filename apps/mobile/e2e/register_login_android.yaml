# VTR-104 Android e2e: native OPAQUE register through the Rust uniffi core.
# Mirrors register_login.yaml (iOS). The Android emulator reaches the dev
# server at http://10.0.2.2:8080 (see apps/mobile/lib/http.ts resolveApiBase).
appId: com.vautr.mobile
---
- launchApp:
    appId: com.vautr.mobile
    clearState: false
- waitForAnimationToEnd
- tapOn:
    text: "Register"
- waitForAnimationToEnd
- tapOn:
    text: "Username"
- eraseText
- inputText: "maestro.android@example.com"
- tapOn:
    text: "Master password"
- inputText: "correct horse battery staple"
- tapOn:
    text: "Confirm master password"
- inputText: "correct horse battery staple"
- tapOn:
    text: "Create account"
- waitForAnimationToEnd:
    timeout: 20000
# After a successful native register the core unlocks + syncs locally and we
# should leave the authenticated vault (no error banner, Register tab gone).
- assertNotVisible:
    text: "Create account"
    optional: true
- assertNotVisible:
    text: "Register"
    optional: true
