# VTR-048 — Maestro E2E flow for the native secret overlay (TDD5).
#
# Verifies the full reveal → view → navigate-away → secret-cleared cycle on a
# real device/emulator:
#   1. Tap "Reveal" on a password field.
#   2. Assert the secret text is visible in the native overlay (UILabel/TextView).
#   3. Navigate away (pop the Detail screen).
#   4. Assert the secret is no longer present (handle released → memory zeroized;
#      the overlay text is empty and a subsequent reveal requires a fresh handle).
#
# Run with:  maestro test e2e/secret_overlay.yaml
# Requires a built debug app with the uniffi native module linked (see README.md).

appId: com.vautr.mobile
name: Secret overlay reveal + clear on navigate

---
- launchApp
- assertVisible: "Secrets"

# Open a secret item and reveal it.
- tapOn:
    id: "secret-row-PASSWORD-1"
- tapOn:
    id: "reveal-secret"

# TDD5a: the plaintext is visible in the native overlay.
- assertVisible:
    id: "secretOverlayText"
- assertVisible: "hunter2-plaintext"

# TDD5b: navigate away (pop the detail screen).
- tapOn:
    id: "back-button"
- assertNotVisible:
    id: "secretOverlayText"

# TDD5c: the secret is cleared — a fresh reveal is required and the previous
# plaintext is not retained anywhere in the overlay surface.
- tapOn:
    id: "secret-row-PASSWORD-1"
- tapOn:
    id: "reveal-secret"
- assertVisible:
    id: "secretOverlayText"
- assertNotVisible: "STALE-SECRET-MARKER"
