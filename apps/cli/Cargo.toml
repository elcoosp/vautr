[package]
name = "vautr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Vautr bws-style command-line client (get, list, run, machine-account login) - docs/architecture/mlp-scope.md §4"

[[bin]]
name = "vautr-cli"
path = "src/main.rs"

[dependencies]
# --- workspace deps (root Cargo.toml `[workspace.dependencies]`) ---
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
uuid.workspace = true
rand.workspace = true
zeroize.workspace = true
vautr-crypto.workspace = true
vautr-auth.workspace = true
vautr-keyring.workspace = true

# --- clap: CLI parsing. Not yet a workspace dep, so declared directly here.
#     (Reported to coordinator as a manifest need for apps/cli; does not touch
#     the root Cargo.toml `[workspace.dependencies]`.) ---
clap = { version = "4", features = ["derive"] }
