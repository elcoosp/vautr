[package]
name = "vautr-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "UniFFI bindings (Swift/Kotlin) for the Vautr client. Spec: arch-design §5.3, data.md"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
uniffi = { version = "0.31", features = ["tokio"] }
base64.workspace = true
uuid.workspace = true
zeroize.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
vautr-domain.workspace = true
vautr-app-state.workspace = true
vautr-crypto.workspace = true
vautr-db.workspace = true
vautr-sharing.workspace = true
vautr-auth.workspace = true
vautr-keyring.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# In-crate integration tests exercise the full unlock->list->reveal->lock flow
# against a real SQLite (temp-file) database, mirroring vautr-app-state/tests.
tempfile = "3"
# `bindgen` feature exposes `uniffi::generate` / `GenerateOptions` used by the
# `gen_bindings` example that produces the Kotlin/Swift glue for modules/vautr-native.
uniffi = { version = "0.31", features = ["tokio", "bindgen"] }
camino = "1"

[features]
# `read_secret` is enabled ONLY for the desktop (GPUI) build — never mobile/web.
# Enables the restricted core API and the FFI `read_secret` binding. CI
# symbol-check (prd.md) asserts `read_secret` is absent from mobile/web artifacts.
desktop-api = ["vautr-app-state/desktop-api"]
