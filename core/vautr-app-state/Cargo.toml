[package]
name = "vautr-app-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Orchestrator, event bus, persistence worker, epoch management. Spec: arch-design §3.2"

[dependencies]
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
dashmap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize.workspace = true
sea-orm.workspace = true
tokio.workspace = true
reqwest.workspace = true
base64.workspace = true
loom = { version = "0.7", optional = true }
vautr-domain.workspace = true
vautr-db.workspace = true
vautr-sync.workspace = true
vautr-auth.workspace = true
vautr-keyring.workspace = true
vautr-crypto = { workspace = true, features = ["sharing"] }
vautr-import.workspace = true
vautr-export.workspace = true
vautr-sharing.workspace = true
vautr-files.workspace = true
hkdf.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
bip39.workspace = true
# Memory locking for secret heap pages (VTR-040). Unix-only; the `mlock`
# feature enables the real `libc::mlock` call. On other platforms the call is
# a documented no-op.
libc = { version = "0.2", optional = true }

[dev-dependencies]
tokio.workspace = true
tempfile = "3"

[features]
# Loom concurrency models for the persistence worker (verification §3.2).
loom = ["dep:loom"]
# Restricted `read_secret` API — only compiled for the Desktop (GPUI) target
# (client.md §2 / data.md §4 Restricted API Rule). CI checks no other target
# enables this symbol.
desktop-api = []
# Production hardening (VTR-040): lock secret heap pages with mlock() so they
# cannot be swapped to disk. Enabled only for desktop builds. No-op elsewhere.
mlock = ["dep:libc"]
