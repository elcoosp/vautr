[package]
name = "vautr-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "wasm-bindgen crypto-only bindings for the web/extension client (ADR-005). Spec: arch-design §5.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
wasm-bindgen.workspace = true
js-sys = "0.3"
# wasm32-unknown-unknown needs a JS-backed RNG. getrandom 0.2 wants the `js`
# feature; getrandom 0.4 wants the `wasm_js` feature (the cfg flag alone is not
# enough for 0.4). These are the only two getrandom versions in the crypto graph.
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
serde.workspace = true
serde-wasm-bindgen = "0.6"
base64.workspace = true
uuid = { version = "1", features = ["v4", "serde", "js"] }
zeroize.workspace = true
# Crypto-only web client (ADR-005): no SQLite (sea-orm), no HTTP transport
# (reqwest/ring/mio). The browser service worker decrypts vault items locally
# and exposes only opaque handles + perform_action (data.md §1 rule 4).
vautr-domain.workspace = true
vautr-crypto = { workspace = true, features = ["sharing"] }
vautr-keyring.workspace = true

[features]
# `read_secret` enabled only for the desktop/web full client, NOT the
# stateless extension service-worker build. CI symbol-check (prd.md) asserts it
# is absent from the restricted web artifact.
desktop-api = []

[dev-dependencies]
# Native-only integration test against the live server (gate 2). Not built for
# wasm32 (dev-deps never compile into the cdylib), so ADR-005 is preserved.
ureq = { version = "2", default-features = false, features = ["json"] }
serde_json.workspace = true
