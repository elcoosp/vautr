[package]
name = "vautr-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "High-throughput, zero-trust import pipeline for Vautr (docs/architecture/data-import-seeding.md)"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize.workspace = true
csv = "1.3"
vautr-domain.workspace = true
vautr-crypto.workspace = true
# VTRFIX-FEAT-H03: the DB + async pipeline is behind the (default) `pipeline`
# feature so the translate/parser surface can compile to wasm32, where
# sea-orm + tokio + sqlx do not.
tokio = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
zip = { version = "2", optional = true }
rayon = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
vautr-db = { workspace = true, optional = true }
vautr-keyring = { workspace = true, optional = true }

[features]
default = ["pipeline"]
# The full ingest pipeline (needs a live SQLite DB + the crypto stack).
pipeline = ["tokio", "sea-orm", "zip", "rayon", "tempfile", "vautr-db", "vautr-keyring"]
# VTRFIX-FEAT-H03: `--no-default-features` produces a wasm-compatible
# parse + translate surface with no DB/tokio/sqlx dependency. The default
# build keeps the full ingest pipeline.

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
