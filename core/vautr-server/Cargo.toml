[package]
name = "vautr-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Axum HTTP server (SQLite, OCC) for Vautr. Spec: docs/architecture/api.md, arch-design §3.3"

[[bin]]
name = "vautr-server"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
uuid.workspace = true
sqlx.workspace = true
vautr-domain.workspace = true
vautr-crypto.workspace = true
ed25519-dalek.workspace = true
# WebAuthn (FIDO2) optional second factor for MP unlock (VTR-052). Feature-gated.
webauthn-rs = { version = "0.5", optional = true }

# --- Wave A MLP pre-seeded deps (single-owner pre-seed so parallel server
# agents never edit this manifest; new deps are requested via the coordinator).
# MFA/TOTP (A4) + machine-account tokens (A2) + password/token generation.
totp-rs = "5"
otpauth = "0.5"
qrcode = "0.14"
base32 = "0.5"
rand.workspace = true
chrono.workspace = true
sha2.workspace = true
# Wave A5 (backups): server endpoints consume the vautr-backup crate.
vautr-backup.workspace = true

[dev-dependencies]
tokio.workspace = true
# Used by the WebAuthn round-trip tests (VTR-052) to generate an EC key and
# build raw registration/assertion payloads that the handler must parse.
sha2.workspace = true
openssl = "0.10"

[features]
default = []
# WebAuthn (FIDO2) optional second factor for MP unlock (VTR-052). OFF by default.
webauthn = ["dep:webauthn-rs"]
