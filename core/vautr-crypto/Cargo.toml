[package]
name = "vautr-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure cryptographic primitives for Vautr. No I/O. (docs/architecture/crypto.md)"

[dependencies]
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
rand.workspace = true
uuid.workspace = true
serde.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
bip39.workspace = true
x25519-dalek.workspace = true
opaque-ke.workspace = true
ed25519-dalek.workspace = true

[features]
# Sharing is "Should" priority (SRS REQ-SHARE-01..04). The X25519 KEM lives
# behind this feature so the core build stays lean. See ADR-007.
sharing = []
# Test-only instrumentation: exposes `TrackedZeroizing` + drop counters used by
# the memory-leak regression test (VTR-037). MUST NOT be enabled in production
# builds — CI asserts this with `cargo build` (no feature) + a symbol check.
test-instrumentation = []

[dev-dependencies]
hex = "0.4"
proptest = "1"

# VTRFIX-FEAT-H03: on wasm32-unknown-unknown, getrandom needs a JS-backed RNG.
# Both major versions appear in this crate's graph (0.2 via bip39/rand_core,
# 0.4 via the newer AEAD stack). Declaring them as direct dependencies here
# with the right feature unifies those features across the whole build, so
# the wasm target resolves without further per-crate changes.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
