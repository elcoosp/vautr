[package]
name = "vautr-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "User-opt-in, anonymous client telemetry aggregator for Vautr (docs/architecture/telemetry.md)"

[dependencies]
serde.workspace = true
uuid.workspace = true
tracing.workspace = true
# Optional HTTP transport for the server-down alert webhook hook (feature
# `webhook`). Kept optional so the core crate stays dependency-light.
reqwest = { workspace = true, features = ["blocking"], optional = true }
# Optional async runtime for the background 24h heartbeat loop (feature `tokio`).
tokio = { workspace = true, features = ["time", "rt", "sync"], optional = true }

[features]
default = []
# Enables the reqwest-based `WebhookDeliverer` for server-down alert delivery.
webhook = ["dep:reqwest"]
# Enables `HttpHeartbeatSender` for client heartbeat delivery over HTTP.
http = ["dep:reqwest"]
# Enables `TelemetryController::start` (background tokio interval loop).
tokio = ["dep:tokio"]

[dev-dependencies]
serde_json.workspace = true
