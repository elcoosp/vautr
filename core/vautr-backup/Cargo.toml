[package]
name = "vautr-backup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Smart automatic backups & one-click restore test for Vautr (docs/architecture/mlp-scope.md §1)"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
uuid.workspace = true
sha2.workspace = true
rand.workspace = true
chacha20poly1305.workspace = true
# SQLite is used only to snapshot a live pool (VACUUM INTO) and to open the
# scratch DB that backs the one-click restore test. Backups are sealed with
# XChaCha20-Poly1305 before they touch disk, so the archive never stores
# plaintext SQLite bytes.
sqlx.workspace = true

[dev-dependencies]
tokio.workspace = true
