<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120">
  <defs>
    <linearGradient id="aurora-standard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5" />
      <stop offset="50%" style="stop-color:#2563EB" />
      <stop offset="100%" style="stop-color:#06B6D4" />
    </linearGradient>
    <style>
      .wordmark { 
        font-family: 'Inter', 'SF Pro Display', system-ui, sans-serif; 
        font-size: 52px; 
        font-weight: 600; 
        fill: #0F172A; 
        letter-spacing: -2px; 
      }
    </style>
  </defs>

  <g id="icon-mobius" transform="translate(15, 15)">
    <!-- Back Layer of the Ribbon -->
    <path d="M 10 80 L 40 10 C 45 0 55 0 60 10 L 90 80" 
          fill="none" stroke="url(#aurora-standard)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
    
    <!-- Front Layer of the Ribbon -->
    <path d="M 10 80 L 40 10 C 45 0 55 0 60 10 L 90 80" 
          fill="none" stroke="url(#aurora-standard)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" 
          stroke-dasharray="140 100" stroke-dashoffset="-10" />
  </g>

  <text x="120" y="80" class="wordmark">Vautr</text>
</svg>