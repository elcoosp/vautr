name: verify-isolation

# Phase 7 guardrails (docs/architecture/roadmap.md §9, build-env-deploy.md §6).
#
# 1. static-boundary-audit  — hard Zero-Knowledge boundary gate. Runs on every
#    push / PR. The security logic below is authoritative and must NOT be
#    weakened: `read_secret` is Desktop-(GPUI-)only and must never leak into a
#    mobile / extension / shared SDK artifact, and the GPUI crate must never
#    appear in the mobile or extension manifests.
# 2. nightly-tests           — exhaustive nightly verification:
#    `cargo test --workspace` + `pnpm typecheck` + `pnpm test`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly build (build-env-deploy.md §6.2) against main, 02:17 UTC.
    - cron: "17 2 * * *"

concurrency:
  group: verify-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static boundary audit (fast, deterministic, no builds).
  # ---------------------------------------------------------------------------
  static-boundary-audit:
    name: Static boundary audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: read_secret must be absent from mobile / extension / client-sdk
        run: |
          set -uo pipefail
          # `read_secret` is compiled into the Desktop (GPUI) build ONLY via the
          # `desktop-api` feature. Any occurrence in a JS/TS tree is a hard
          # Zero-Knowledge breach. A match exits non-zero and fails the job.
          # Doc comments legitimately mention the symbol (e.g. "read_secret is
          # compiled OUT of this WASM entrypoint"), so comment-only lines are
          # filtered; actual code references (the leak) are NOT filtered.
          if grep -rn "read_secret" \
              apps/mobile \
              apps/extension \
              packages/vautr-client-sdk \
              --exclude-dir=node_modules --exclude-dir=dist \
              2>/dev/null | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(\*|//|/\*)'; then
            echo "::error::CRITICAL SECURITY BREACH: 'read_secret' found in a non-desktop artifact (apps/mobile, apps/extension, or packages/vautr-client-sdk). The Zero-Knowledge boundary is broken; remove it and re-run."
            exit 1
          fi
          echo "::notice::read_secret absent from mobile/extension/client-sdk (Zero-Knowledge boundary intact)"

      - name: GPUI crate markers must never appear in mobile / extension manifests
        run: |
          set -uo pipefail
          # GPUI is the Desktop rendering crate. It must never be referenced by
          # the React Native package.json or the Manifest V3 extension manifest.
          if grep -q "gpui" \
              apps/mobile/package.json \
              apps/extension/manifest.json \
              2>/dev/null; then
            echo "::error::CRITICAL SECURITY BREACH: 'gpui' marker found in apps/mobile/package.json or apps/extension/manifest.json. Remove the Desktop dependency and re-run."
            exit 1
          fi
          echo "::notice::No 'gpui' markers in mobile/extension manifests"

      - name: Restricted API symbol check (scripts/check-restricted-api.sh)
        run: |
          set -uo pipefail
          if [ -f scripts/check-restricted-api.sh ]; then
            echo "::group::check-restricted-api.sh"
            # The script builds vautr-wasm for wasm32-unknown-unknown, so the
            # pinned nightly plus that target must exist before it runs.
            rustup toolchain install nightly-2026-08-10 --component rustfmt --target wasm32-unknown-unknown --profile minimal 2>/dev/null || true
            bash scripts/check-restricted-api.sh
            echo "::endgroup::"
          else
            echo "::notice::scripts/check-restricted-api.sh not present; skipping FFI symbol check"
          fi

      - name: Setup pnpm (for token-drift gate)
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Design-token drift gate (check:tokens)
        # Phase 9 deliverable: fail the PR if tokens.json and any generated
        # output (tokens.css, tokens.rs, tokens.ts, vautr-theme.json, tokens.md,
        # apps/desktop/src/theme_tokens.rs) are out of sync. One author, no drift.
        run: pnpm --filter @vautr/design-tokens check:tokens

      - name: test-instrumentation feature must NOT leak into production builds
        # VTR-037 (step 5): the memory-leak instrumentation in vautr-crypto is
        # gated behind the `test-instrumentation` feature. It must never be
        # compiled into a production/handshake artifact. Build vautr-crypto
        # WITHOUT the feature and assert the `instrumentation` module symbol is
        # absent from the emitted rlib (compile-fail guard).
        run: |
          set -uo pipefail
          cargo build -p vautr-crypto 2>/dev/null
          if grep -rq "instrumentation" target/debug/deps/libvautr_crypto-*.rlib 2>/dev/null; then
            echo "::error::SECURITY/HYGIENE BREACH: vautr-crypto 'test-instrumentation' module leaked into a production build. The feature must stay disabled in release artifacts."
            exit 1
          fi
          echo "::notice::vautr-crypto built without test-instrumentation (no leak)"

  # ---------------------------------------------------------------------------
  # Nightly exhaustive verification (build-env-deploy.md §6.2 / roadmap §9).
  # ---------------------------------------------------------------------------
  nightly-tests:
    name: Nightly tests (cargo + pnpm)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Nightly-2026-08-10, matching rust-toolchain.toml. Required by the
        # Desktop client's git-master `gpui` (zed) dependency (uses unstable std
        # features such as std::hint::cold_path). Pinned so the toolchain does
        # not drift under the workspace. See tech-stack.md §4.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-10
          components: rustfmt, clippy

      - name: Install Linux system libs (desktop gpui deps)
        # VTR-CI: `cargo test --workspace` compiles the desktop client, whose
        # gpui/font-kit graph needs fontconfig + X11/Wayland/EGL libs
        # (yeslogic-fontconfig-sys → "Package fontconfig was not found", then a
        # cc/rust-lld link failure for the GUI sys crates, e.g. -lxkbcommon-x11).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-composite0-dev \
            libxcb-icccm4-dev libxcb-shm0-dev libxcb-xkb-dev \
            libxcb-keysyms1-dev libxcb-util-dev \
            libxcb-xinerama0-dev libxcb-glx0-dev libxcb-randr0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgtk-3-dev libglib2.0-dev \
            libssl-dev libdbus-1-dev libexpat1-dev libvulkan-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libxext-dev libxi-dev libxtst-dev libxrender-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxss-dev \
            libasound2-dev libsndio-dev libpulse-dev

      - name: Rust workspace tests
        run: cargo test --workspace

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (pnpm typecheck)
        run: pnpm typecheck

      - name: Test (pnpm test)
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Nightly extension accessibility + visual gallery (Phase 9).
  # Browser-only: the A11y and screenshot specs audit the locked popup and
  # capture per-state PNGs without a backend, so they run green with no server.
  # (Server-backed live E2E — popup-flow / cli / desktop — needs a running
  # Vautr server and is a separate follow-up; those suites are #[ignore]/manual.)
  # ---------------------------------------------------------------------------
  extension-a11y:
    name: Extension A11y + gallery (Playwright)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain (pinned nightly + wasm target for prepare:wasm)
        # check-wasm.mjs fails the extension build when the gitignored
        # wasm-pkg outputs are absent (fresh CI checkout), so build real
        # crypto WASM from source instead of falling back to the dev mock.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-10
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM artifacts
        run: pnpm prepare:wasm

      - name: Build extension
        run: pnpm --filter @vautr/extension build

      - name: Install Playwright chromium
        run: pnpm --filter @vautr/extension exec playwright install chromium

      - name: A11y audit + screenshot gallery
        run: pnpm --filter @vautr/extension exec playwright test tests/popup-a11y.spec.ts tests/popup-screenshots.spec.ts

  # ---------------------------------------------------------------------------
  # Nightly coverage fuzzing (VTR-037).
  # Feeds arbitrary bytes to vautr_crypto::aead::decrypt and asserts it never
  # panics (returns Err). Bounded to FUZZ_SECONDS (default 120s in CI; the
  # local recommendation is 3600s / 1h per the issue). A crash fails the job.
  # ---------------------------------------------------------------------------
  nightly-fuzz:
    name: Nightly cargo-fuzz (aead_decrypt)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly + cargo-fuzz
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-10
          components: rustfmt

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz target
        working-directory: core/vautr-crypto
        run: cargo +nightly fuzz build aead_decrypt

      - name: Run fuzzer (bounded)
        working-directory: core/vautr-crypto
        env:
          FUZZ_SECONDS: "120"
        run: cargo +nightly fuzz run aead_decrypt -- -max_total_time=${FUZZ_SECONDS} -print_final_stats=1

      - name: Memory-leak regression (test-instrumentation)
        # VTR-037: reveal+copy 10k secrets, assert the drop counter returns to
        # baseline (no plaintext retained). Gated feature, run only here.
        run: cargo test -p vautr-crypto --features test-instrumentation instrumentation

  # ---------------------------------------------------------------------------
  # Nightly Pact contract verification (VTR-037).
  # The SDK consumer test (packages/vautr-client-sdk/test/pact) writes
  # pacts/vautr-client-sdk-vautr-server.json. Here we boot the real Rust server
  # and verify it honours that contract. Requires the Pact standalone verifier
  # (installed below) and a built server binary.
  # ---------------------------------------------------------------------------
  pact-verify:
    name: Nightly Pact contract verify (server)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-10
          components: rustfmt

      - name: Build server
        run: cargo build -p vautr-server

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate consumer pact
        run: pnpm --filter @vautr/client-sdk test:pact

      - name: Install Pact standalone verifier
        run: |
          set -uo pipefail
          # VTR-CI: the verifier lives in pact-foundation/pact-reference under
          # the pact_verifier_cli-vX.Y.Z tag with `pact-verifier-<os>-<arch>.gz`
          # assets (the old pact-rust URL 404s).
          VERIFIER_VERSION="1.3.5"
          curl -fsSL "https://github.com/pact-foundation/pact-reference/releases/download/pact_verifier_cli-v${VERIFIER_VERSION}/pact-verifier-linux-x86_64.gz" -o pact_verifier.gz
          gunzip -c pact_verifier.gz > pact-verifier-linux-x86_64
          chmod +x pact-verifier-linux-x86_64
          sudo mv pact-verifier-linux-x86_64 /usr/local/bin/pact_verifier

      - name: Start server + verify pact
        run: |
          set -uo pipefail
          # Minimal server config; the verifier only exercises /sync/push-batch.
          # The pact-reference Rust verifier uses --file/--provider-name/
          # --hostname/--port (not the Ruby verifier's --contracts-dir).
          DATABASE_URL="sqlite::memory:" RUST_LOG=info cargo run -p vautr-server &
          SERVER_PID=$!
          sleep 5
          pact_verifier \
            --file packages/vautr-client-sdk/pacts/vautr-client-sdk-vautr-server.json \
            --provider-name vautr-server \
            --hostname 127.0.0.1 \
            --port 8080
          RC=$?
          kill $SERVER_PID || true
          exit $RC
