# Vautr production stack — explicit healthchecks, restart policies, and a
# continuous SQLite backup sidecar (litestream).
#
#   docker compose -f docker-compose.prod.yml --profile https up -d
#
# SQLite is the default database (persisted in the `serverdata` volume and
# replicated by litestream to an object store you configure in the sidecar).

name: vautr-prod

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FEATURES: ${VAUTR_FEATURES:-}
        # VTRFIX: VAUTR_DB_URL is runtime env ONLY — it used to be passed as a
        # build arg and baked into the image config (credential leak).
    image: vautr/server:latest
    restart: unless-stopped
    # VTRFIX-SEC-M14: do NOT publish plaintext 8080 in prod. Caddy fronts this
    # service over the internal docker network. If you must expose the raw port
    # for debugging, uncomment the line below on a trusted network only.
    # ports:
    #   - "${VAUTR_PORT:-8080}:8080"
    environment:
      VAUTR_DB_URL: ${VAUTR_DB_URL:-sqlite:/data/vautr.db}
      RUST_LOG: ${RUST_LOG:-info}
      # OPAQUE server setup provisioned out-of-band (the prod server fails
      # closed without it). Moved here from the backup sidecar, where it was
      # dead config — litestream never reads this variable.
      VAUTR_OPAQUE_SETUP_FILE: /run/secrets/opaque-setup.bin
    volumes:
      - serverdata:/data
      - ./secrets/opaque-setup.bin:/run/secrets/opaque-setup.bin:ro
    healthcheck:
      # VTRFIX (HIGH): /account/status is auth-gated (401 without a bearer),
      # which curl -f treats as failure — the container was permanently
      # unhealthy and caddy never started. Probe /health instead.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Continuous SQLite -> object-store replication (litestream). Point
  # LITESTREAM_*/AWS_* at your bucket. Disabled by default; enable with
  # `docker compose -f docker-compose.prod.yml --profile backup up -d`.
  backup:
    image: litestream/litestream:latest
    restart: unless-stopped
    profiles: ["backup"]
    command: ["replicate"]
    # VTRFIX (HIGH): this service had a DUPLICATE `volumes:` key (the second one
    # silently overwrote the first) and the S3 credentials were indented under
    # `volumes:` instead of `environment:`. Restructured into a single
    # environment map + a single volumes list.
    volumes:
      - serverdata:/data:ro
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      # Replica target consumed by deploy/litestream.yml (${VAUTR_LITESTREAM_URL}).
      VAUTR_LITESTREAM_URL: ${VAUTR_LITESTREAM_URL:-}
    depends_on:
      server:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    environment:
      VAUTR_DOMAIN: ${VAUTR_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  serverdata:
  caddydata:
  caddyconfig:
