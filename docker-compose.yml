# Vautr self-hosted stack. See docs/SELF-HOSTING.md for full instructions.
#
#   docker compose up -d --build          # SQLite server, no TLS (one click)
#   docker compose --profile https up -d  # + Caddy HTTPS / Let's Encrypt
#   docker compose --profile postgres up -d  # + PostgreSQL backend (opt-in)
#
# SQLite is the DEFAULT database. The bundled vautr-server image is
# SQLite-backed (sqlx `sqlite` feature only). PostgreSQL is opt-in:
#
#   VAUTR_DB_URL=postgres://vautr:vautr@postgres:5432/vautr \
#   VAUTR_FEATURES=postgres \
#   docker compose --profile postgres up -d --build
#
# (the `postgres` cargo feature + sqlx `postgres` feature must exist in the
# Rust manifests first — see docs/SELF-HOSTING.md §"Database").

name: vautr

services:
  # -------------------------------------------------------------------------
  # vautr-server — the untrusted, zero-knowledge blob store (Axum, :8080).
  # -------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Extra cargo features for the server build. Set VAUTR_FEATURES=postgres
        # to build a Postgres-enabled image (requires the manifest feature).
        FEATURES: ${VAUTR_FEATURES:-}
        VAUTR_DB_URL: ${VAUTR_DB_URL:-sqlite:vautr.db}
    image: vautr/server:latest
    restart: unless-stopped
    ports:
      - "${VAUTR_PORT:-8080}:8080"
    environment:
      # SQLite default (persistent volume mounted at /data).
      VAUTR_DB_URL: ${VAUTR_DB_URL:-sqlite:/data/vautr.db}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - serverdata:/data
    # SQLite needs no database dependency. When Postgres is enabled, uncomment
    # the Postgres service + `depends_on` below and set VAUTR_DB_URL.
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/account/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------------------
  # dev — hot-reload development server (VTR-010 TDD #4). Enable with
  # `docker compose --profile dev up`. Bind-mounts the source so editing a
  # Rust file triggers an automatic recompile + restart via cargo-watch.
  # -------------------------------------------------------------------------
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: vautr/server:dev
    ports:
      - "${VAUTR_PORT:-8080}:8080"
    environment:
      VAUTR_DB_URL: ${VAUTR_DB_URL:-sqlite:/data/vautr.db}
      RUST_LOG: ${RUST_LOG:-debug}
    volumes:
      # Live source for hot reload; target/ cached in a named volume so the
      # dependency tree isn't recompiled on every restart.
      - ./core:/build/core
      - ./packages:/build/packages
      - ./Cargo.toml:/build/Cargo.toml:ro
      - ./Cargo.lock:/build/Cargo.lock:ro
      - devtarget:/build/target
      - serverdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/account/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------------------
  # PostgreSQL backend — OPT-IN. Enable with --profile postgres.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vautr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vautr}
      POSTGRES_DB: ${POSTGRES_DB:-vautr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vautr} -d ${POSTGRES_DB:-vautr}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # -------------------------------------------------------------------------
  # Caddy reverse proxy — OPT-IN HTTPS + Let's Encrypt. Enable with
  # --profile https. Requires VAUTR_DOMAIN (and optionally VAUTR_EMAIL).
  # The Caddyfile at deploy/Caddyfile uses {$VAUTR_DOMAIN} substitution.
  # -------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    environment:
      # Optional: only used when the https profile is active. Empty by default so
      # `docker compose config` validates without it; set it before
      # `docker compose --profile https up`.
      VAUTR_DOMAIN: ${VAUTR_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  serverdata:
  devtarget:
  pgdata:
  caddydata:
  caddyconfig:
